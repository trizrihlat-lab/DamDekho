<!DOCTYPE html>
<html>
<head>
  <title>DamDekho</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .price {
      color: green;
      font-weight: bold;
    }

    a {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      background: blue;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<h1>🔥 DamDekho</h1>

<div id="products"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzSxntiuy1kev3NC7NMXAi7DpZhVU0QnfUHY2p9NidtBeEugC9ETbrx5mqUey7B1m_k/exec";

fetch(API_URL)
.then(res => res.json())
.then(data => {

  let grouped = {};

  data.forEach(item => {
    if (!grouped[item.product]) {
      grouped[item.product] = [];
    }
    grouped[item.product].push(item);
  });

  let html = "";

  Object.keys(grouped).forEach(productName => {

    let items = grouped[productName];
    let minPrice = Math.min(...items.map(i => Number(i.price)));

    html += `
      <div style="
        background:white;
        margin:20px 0;
        padding:15px;
        border-radius:12px;
        box-shadow:0 4px 10px rgba(0,0,0,0.1);
      ">

      <h2 style="margin-bottom:10px;">🔥 ${productName}</h2>
    `;

    items.forEach(item => {

      let isCheapest = Number(item.price) === minPrice;

      html += `
        <div style="
          display:flex;
          align-items:center;
          justify-content:space-between;
          padding:10px;
          margin:8px 0;
          border:1px solid #eee;
          border-radius:10px;
          ${isCheapest ? 'background:#e8f5e9;border:2px solid green;' : ''}
        ">

          <div style="display:flex;align-items:center;gap:10px;">

            <img src="${item.image}" 
                 style="width:50px;height:50px;border-radius:8px;object-fit:cover;">

            <div>
              <b>${item.store}</b><br>
              ৳${item.price}
              ${isCheapest ? '🔥 Lowest' : ''}
            </div>

          </div>

          <a href="${item.link}" target="_blank"
             style="background:blue;color:white;padding:8px 12px;border-radius:6px;text-decoration:none;">
             Buy
          </a>

        </div>
      `;
    });

    html += `</div>`;
  });

  document.getElementById("products").innerHTML = html;

});
</script>

</body>
</html>
