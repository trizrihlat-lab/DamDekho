<!DOCTYPE html>
<html>
<head>
  <title>DamDekho</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .price {
      color: green;
      font-weight: bold;
    }

    a {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      background: blue;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<h1>🔥 DamDekho</h1>

<div id="products"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzSxntiuy1kev3NC7NMXAi7DpZhVU0QnfUHY2p9NidtBeEugC9ETbrx5mqUey7B1m_k/exec";

fetch(API_URL)
.then(res => res.json())
.then(data => {

  let grouped = {};

  data.forEach(item => {
    if (!grouped[item.product]) {
      grouped[item.product] = [];
    }
    grouped[item.product].push(item);
  });

  let html = "";

  Object.keys(grouped).forEach(productName => {

    let items = grouped[productName];

    let minPrice = Math.min(...items.map(i => Number(i.price)));

    html += `<div style="background:white;padding:15px;margin:10px;border-radius:10px;">`;
    html += `<h2>${productName}</h2>`;

    items.forEach(item => {

      let isCheapest = Number(item.price) === minPrice;

      html += `
        <div style="
          padding:8px;
          margin:5px 0;
          border:1px solid #ddd;
          border-radius:5px;
          ${isCheapest ? 'background:#d4edda;border-color:green;' : ''}
        ">
          <b>Store:</b> ${item.store} <br>
          <b>Price:</b> ৳${item.price} 
          ${isCheapest ? '🔥 Lowest Price' : ''}
          <br>
          <a href="${item.link}" target="_blank">Buy</a>
        </div>
      `;
    });

    html += `</div>`;
  });

  document.getElementById("products").innerHTML = html;

});

</script>

</body>
</html>
